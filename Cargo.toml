[package]
name = "cbpe-fast"
version = "0.1.0"
edition = "2021"
description = "Native encoder for Combinatorial BPE tokenizers, token-identical to the Python reference"
license = "MIT"
readme = "README.md"

[lib]
name = "cbpe_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rustc-hash = "2"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
